# Booking service for The Pitch at Slush (/the-pitch). See README.md.
name = "forwardone-pitch-booking"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "forwardone-pitch"
# Filled in at deploy time by .github/workflows/deploy-booking.yml.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Hourly: expire unreviewed requests (only when HOLD_DAYS is set).
# 17:00 UTC (18:00 Amsterdam in winter): the daily overview to the reviewers.
[triggers]
crons = ["17 * * * *", "0 17 * * *"]

[vars]
# Pages that may call the API (comma separated origins).
ALLOWED_ORIGINS = "https://tekka2026.github.io,https://forward.one,https://www.forward.one"
# The live pitch page on Webflow (owner, 2026-10-27), linked from the
# dashboard and the emails.
PAGE_URL = "https://www.forward.one/events/2026/the-pitch-at-slush-2026"
# The H1's blank as an underline (owner, 2026-10-26).
EVENT_NAME = "The _____ Pitch at Slush"
# Shown in the calendar invite; empty until the venue is known (A0016).
EVENT_LOCATION = ""
# Sender (owner, 2026-10-26; forward.one verified with Resend). Replies go
# to this address. Empty: emails are logged, not sent.
MAIL_FROM = "FORWARD.one <cailin.greiner@forward.one>"
# Days an unreviewed request holds its slot; empty: it holds until decided.
HOLD_DAYS = ""

# Secrets (wrangler secret put; set by .github/workflows/deploy-booking.yml):
# REVIEWERS (comma separated emails that may log in to /review and are told
# of new requests; a secret so the addresses stay out of the repository),
# RESEND_API_KEY, SESSION_SECRET.
