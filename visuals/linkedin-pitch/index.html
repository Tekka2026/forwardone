<!doctype html>
<!-- LinkedIn visual for The ____ Pitch at Slush (owner, 2026-10-27): 5:7,
     1500 x 2100. Rendered to PNG by visuals/render.mjs (GitHub Actions,
     .github/workflows/render-visuals.yml). Type and colours follow the
     page (/the-pitch, DESIGN.md): Inter 500 like its H1 (owner, 2026-10-27). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Pitch at Slush: LinkedIn</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&display=block">
<style>
  @font-face {
    font-family: "Geist Mono";
    src: url("../../src/assets/fonts/geist-mono/GeistMono-Medium.woff2") format("woff2");
    font-weight: 500;
    font-display: block;
  }
  :root {
    --bg: #ffffff;
    --bg-start: #ededed; /* the light part: #EDEDED at the top to white at the bottom (owner, 2026-10-27) */
    --fg: #111111;
    --muted: #8a8a8a;
    --blank-line: #111111;
    --hand-gradient: linear-gradient(to top right, #04edcd, #05f46b);
    --pad: 120px;
  }
  * { margin: 0; box-sizing: border-box; }
  body { background: var(--bg); }
  .card {
    width: 1500px;
    height: 2100px;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
  }
  .top {
    flex: 1;
    background: linear-gradient(to bottom, var(--bg-start), var(--bg));
    display: flex;
    flex-direction: column;
    padding: var(--pad);
  }
  /* The three logos at one height, filling the width inside the padding
     (owner, 2026-10-27). Widths per unit of height: FORWARD.one 9.95,
     Balnord 4.28, HCVC 4.53; gaps of 2 heights: 22.76 heights in all. */
  .logos {
    --logo-h: calc((1500px - 2 * var(--pad)) / 22.76);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logos img { height: var(--logo-h); display: block; }
  .title-block { margin-top: auto; }
  .eyebrow {
    font-family: "Geist Mono", monospace;
    font-weight: 500;
    font-size: 40px; /* the mono tags, one size (owner, 2026-10-27) */
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 40px;
  }
  .eyebrow .brand {
    background: var(--hand-gradient);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 {
    font-family: "Inter", sans-serif;
    font-weight: 500;
    font-size: 250px;
    line-height: 1.04;
  }
  .blank {
    display: inline-block;
    width: 2.7em;
    margin-inline: 0.12em;
    border-bottom: 0.035em solid var(--blank-line);
    height: 0.8em;
    /* Where the line sits on the page and in the video: a little under the
       letters' baseline, room for the handwriting's descenders. */
    vertical-align: -0.164em;
  }
  .line { white-space: nowrap; }
  .facts {
    background: #000000;
    color: #ffffff;
    padding: 96px var(--pad) 120px;
  }
  .label {
    font-family: "Geist Mono", monospace;
    font-weight: 500;
    font-size: 40px; /* the mono tags, one size (owner, 2026-10-27) */
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 24px;
  }
  .date {
    font-family: "Inter", sans-serif;
    font-weight: 500;
    font-size: 110px;
    line-height: 1.04;
  }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="top">
      <div class="logos">
        <img src="../../src/assets/brand/forwardone.svg" alt="FORWARD.one">
        <img src="../../src/assets/brand/balnord.svg" alt="Balnord">
        <img src="../../src/assets/brand/hcvc.svg" alt="HCVC">
      </div>
      <div class="title-block">
        <p class="eyebrow"><span class="brand">Slush</span>, Helsinki</p>
        <h1><span class="line">The<span class="blank"></span></span><br>Pitch</h1>
      </div>
    </div>
    <div class="facts">
      <p class="label">When</p>
      <p class="date">November 18th, 2026</p>
    </div>
  </div>
</body>
</html>
