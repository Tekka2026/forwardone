<!doctype html>
<!-- LinkedIn video for The ____ Pitch at Slush (owner, 2026-10-27): the
     still (../linkedin-pitch) with ten portfolio names typed and erased on
     the blank, in the page's handwriting. Frames come from window.frame(ms);
     visuals/animate.mjs records them to MP4. 5:7, 1500 x 2100. Rendered to PNG by visuals/render.mjs (GitHub Actions,
     .github/workflows/render-visuals.yml). Type and colours follow the
     page (/the-pitch, DESIGN.md): Inter 500 like its H1 (owner, 2026-10-27). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Pitch at Slush: LinkedIn</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=Covered+By+Your+Grace&display=block">
<style>
  @font-face {
    font-family: "Geist Mono";
    src: url("../../src/assets/fonts/geist-mono/GeistMono-Medium.woff2") format("woff2");
    font-weight: 500;
    font-display: block;
  }
  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #8a8a8a;
    --blank-line: #111111;
    --blank-line-filled: #c4c3be;
    --hand-gradient: linear-gradient(to top right, #04edcd, #05f46b);
    --pad: 120px;
  }
  * { margin: 0; box-sizing: border-box; }
  body { background: var(--bg); }
  .card {
    width: 1500px;
    height: 2100px;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
  }
  .top {
    flex: 1;
    min-height: 0; /* the band below never moves */
    display: flex;
    flex-direction: column;
    padding: var(--pad);
  }
  /* The three logos at one height, filling the width inside the padding
     (owner, 2026-10-27). Widths per unit of height: FORWARD.one 9.95,
     Balnord 4.28, HCVC 4.53; gaps of 2 heights: 22.76 heights in all. */
  .logos {
    --logo-h: calc((1500px - 2 * var(--pad)) / 22.76);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logos img { height: var(--logo-h); display: block; }
  /* "Slush, Helsinki" stays put where it sits in the still (owner,
     2026-10-27); the heading hangs from it and shrinks upward-anchored. */
  .title-block { margin-top: 784px; }
  .eyebrow {
    font-family: "Geist Mono", monospace;
    font-weight: 500;
    font-size: 40px; /* the mono tags, one size (owner, 2026-10-27) */
    letter-spacing: 0.14em;
    text-transform: uppercase;
    margin-bottom: 40px;
  }
  .eyebrow .brand {
    background: var(--hand-gradient);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 {
    font-family: "Inter", sans-serif;
    font-weight: 500;
    font-size: 250px;
    line-height: 1.04;
  }
  /* As on the page (/the-pitch): the line max(2px, 0.035em) thick, black
     while empty and light grey once a name is on it; at least 2.7em long
     while the name is short, then hugging it. */
  .blank {
    display: inline-block;
    min-width: 2.7em;
    margin-inline: 0.12em;
    padding-inline: 0.08em;
    border-bottom: max(2px, 0.035em) solid var(--blank-line);
    line-height: 1;
  }
  .blank.is-filled { border-bottom-color: var(--blank-line-filled); }
  /* The handwriting at 1.3em of the H1, each letter with its own slight
     wobble and its slice of one gradient across the name (page:
     .pitch__hand, .pitch__letter-hw). */
  .hand {
    display: inline-block;
    font-family: "Covered By Your Grace", cursive;
    font-size: 1.3em;
    font-weight: 400;
    line-height: 1;
    white-space: pre;
    transform: translateY(0.04em);
    /* Taller than the heading's letters: without this the handwriting would
       push the heading down from where the still has it. */
    margin-top: -1em;
    margin-bottom: -0.2em;
  }
  .hw {
    --pad: 0.2em;
    display: inline-block;
    padding: var(--pad);
    margin: calc(-1 * var(--pad));
    background-image: var(--hand-gradient);
    background-size: var(--hw-w, 1em) 100%;
    background-position: calc(-1 * var(--hw-x, 0em)) 0;
    background-repeat: no-repeat;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .caret {
    display: inline-block;
    width: max(2px, 0.035em);
    height: 0.75em;
    margin-left: 0.04em;
    vertical-align: -0.05em;
    background: #04edcd;
  }
  .line { white-space: nowrap; }
  .facts {
    flex-shrink: 0;
    background: #000000;
    color: #ffffff;
    padding: 96px var(--pad) 120px;
  }
  .label {
    font-family: "Geist Mono", monospace;
    font-weight: 500;
    font-size: 40px; /* the mono tags, one size (owner, 2026-10-27) */
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 24px;
  }
  .date {
    font-family: "Inter", sans-serif;
    font-weight: 500;
    font-size: 110px;
    line-height: 1.04;
  }
</style>
</head>
<body data-video>
  <div class="card" id="card">
    <div class="top">
      <div class="logos">
        <img src="../../src/assets/brand/forwardone.svg" alt="FORWARD.one">
        <img src="../../src/assets/brand/balnord.svg" alt="Balnord">
        <img src="../../src/assets/brand/hcvc.svg" alt="HCVC">
      </div>
      <div class="title-block">
        <p class="eyebrow"><span class="brand">Slush</span>, Helsinki</p>
        <h1><span class="line">The<span class="blank" id="blank"><span class="hand" id="hand">&#8203;</span></span></span><br>Pitch</h1>
      </div>
    </div>
    <div class="facts">
      <p class="label">When</p>
      <p class="date">18 November</p>
    </div>
  </div>
<script>
  // Ten current portfolio companies (src/content/founders.ts, from
  // forward.one/portfolio, A0013).
  var NAMES = ['QuantWare', 'QuiX Quantum', 'Optics11', 'ExRobotics', 'Fizyr', 'Voltfang', 'ORE Energy', 'Sapient Perception', 'Fibersail', 'SenseGlove'];
  var TYPE = 85, HOLD = 1500, ERASE = 40, GAP = 500, START = 700, WRITE = 300; // ms
  // Size changes glide over SMOOTH ms (the page: 240ms font-size and 360ms
  // line transitions), so the heading never jumps.
  var SMOOTH = 450, LINE_MIN = 2.7; // em, the empty line's length
  var BASE = 250, ROOM = 1260; // the H1's size and the width it may take (px)
  var h1 = document.querySelector('h1'), line = document.querySelector('.line');
  var blank = document.getElementById('blank'), hand = document.getElementById('hand');
  var caret = document.createElement('span');
  caret.className = 'caret';
  // Same wobble on every run (the page picks it at random).
  var seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }

  // Lay out a name's letters; p (0..1 per letter) is how far each is written.
  function draw(name, n, progress) {
    hand.textContent = '\u200b';
    for (var j = 0; j < n; j++) {
      var s = document.createElement('span'), w = name.wobble[j], q = progress ? progress[j] : 1;
      s.className = 'hw';
      s.textContent = name.text[j];
      s.style.setProperty('--hw-x', name.x[j] + 'em');
      s.style.setProperty('--hw-w', name.w + 'em');
      s.style.transform = 'translateY(' + (w.y - 0.06 * (1 - q)) + 'em) rotate(' + w.r + 'deg)';
      // The page's pitch-write: each letter is uncovered left to right.
      if (q < 1) s.style.clipPath = 'inset(-0.6em calc(' + (1 - q) * 100 + '% + ' + (q * -0.6) + 'em) -0.6em -0.6em)';
      hand.appendChild(s);
    }
  }
  // The H1 at full size, smaller only when a name would not fit (the page
  // does the same, .pitch__title's --pitch-scale).
  function measure(text) {
    var name = { text: text, wobble: [], x: [], w: 0 };
    for (var j = 0; j < text.length; j++) name.wobble.push({ r: (rnd() * 4 - 2).toFixed(2), y: (rnd() * 0.04 - 0.02).toFixed(3) });
    h1.style.fontSize = BASE + 'px';
    name.x = text.split('').map(function () { return 0; });
    draw(name, text.length);
    var fs = parseFloat(getComputedStyle(hand).fontSize), letters = hand.querySelectorAll('.hw'), x0 = letters[0].offsetLeft, x1 = 0;
    letters.forEach(function (l, j) { name.x[j] = +((l.offsetLeft - x0) / fs).toFixed(3); x1 = Math.max(x1, l.offsetLeft + l.offsetWidth); });
    name.w = +((x1 - x0) / fs).toFixed(3);
    // The heading's scale for every number of letters written, with the line
    // at full length below 5 letters and hugging the name from 5 (page rule).
    name.scales = [];
    for (var k = 0; k <= text.length; k++) {
      draw(name, k);
      blank.style.minWidth = (k >= 5 ? 0 : LINE_MIN) + 'em';
      name.scales.push(Math.min(1, ROOM / line.getBoundingClientRect().width));
    }
    return name;
  }
  var plan = [], t = START;
  function build() {
    seed = 7; plan = []; t = START;
    NAMES.forEach(function (n) {
      var p = measure(n);
      p.typed = t; p.held = t + n.length * TYPE; p.erased = p.held + HOLD; p.end = p.erased + n.length * ERASE;
      plan.push(p);
      t = p.end + GAP;
    });
    window.DURATION = t;
  }
  // Where scale and line length are heading at time ms.
  function letters(ms) {
    var i = plan.findIndex(function (p) { return ms < p.end + GAP; });
    var p = plan[i < 0 ? plan.length - 1 : i], n = 0;
    if (ms >= p.typed && ms < p.held) n = Math.min(p.text.length, Math.floor((ms - p.typed) / TYPE) + 1);
    else if (ms >= p.held && ms < p.erased) n = p.text.length;
    else if (ms >= p.erased && ms < p.end) n = p.text.length - Math.floor((ms - p.erased) / ERASE) - 1;
    return { p: p, n: Math.max(0, n) };
  }
  function target(ms) {
    var l = letters(Math.max(0, ms));
    return { scale: l.p.scales[l.n], minw: l.n >= 5 ? 0 : LINE_MIN };
  }
  var ease = function (x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };

  window.frame = function (ms) {
    // Which name, and how many letters (and how far the newest are written).
    var i = plan.findIndex(function (p) { return ms < p.end + GAP; });
    if (i < 0) i = plan.length - 1;
    var p = plan[i], prev = plan[i - 1] || plan[plan.length - 1];
    var n = 0, progress = null, typing = false;
    if (ms >= p.typed && ms < p.held) {
      n = Math.min(p.text.length, Math.floor((ms - p.typed) / TYPE) + 1);
      progress = [];
      for (var j = 0; j < n; j++) progress.push(Math.min(1, ease(Math.min(1, (ms - p.typed - j * TYPE) / WRITE))));
      typing = true;
    } else if (ms >= p.held && ms < p.erased) n = p.text.length;
    else if (ms >= p.erased && ms < p.end) { n = p.text.length - Math.floor((ms - p.erased) / ERASE) - 1; typing = true; }
    // Scale and line length follow the letters on the line, eased over
    // SMOOTH ms (a triangle-weighted average of where they are heading).
    var sum = 0, sc = 0, mw = 0;
    for (var q = -14; q <= 0; q++) {
      var w = 15 + q, tt = target(ms + q * SMOOTH / 14);
      sum += w; sc += w * tt.scale; mw += w * tt.minw;
    }
    var scale = sc / sum;
    h1.style.fontSize = (BASE * scale).toFixed(2) + 'px';
    blank.style.minWidth = (mw / sum).toFixed(3) + 'em';
    draw(p, n, progress);
    blank.classList.toggle('is-filled', n > 0);
    // The caret blinks once a second while waiting, and stays on while writing.
    var on = typing || ms % 1000 < 500;
    if (on) hand.appendChild(caret);
    return [p.text.slice(0, n), progress ? progress.map(function (q) { return q.toFixed(2); }).join() : '', on, scale.toFixed(4), blank.style.minWidth].join('|');
  };
  document.fonts.ready.then(function () {
    build();
    window.frame(0);
    document.body.dataset.ready = '1';
  });
</script>
</body>
</html>
