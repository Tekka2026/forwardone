<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dither Track</title>
<style>
  :root { --bg:#0b0d13; --panel:#12151d; --line:#232836; --text:#e8ebf2; --dim:#8a92a6; --accent:#ff5a14; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
  #stage { position: relative; display: grid; place-items: center; padding: 16px; min-height: 0; height: 100vh; }
  #out { max-width: 100%; max-height: calc(100vh - 84px); cursor: crosshair; background: #000; image-rendering: pixelated; }
  #bar { position: absolute; left: 16px; right: 16px; bottom: 12px; display: flex; gap: 8px; align-items: center; }
  #bar input[type=range] { flex: 1; }
  #hint { position: absolute; top: 12px; left: 16px; color: var(--dim); pointer-events: none; }
  #panel { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; height: 100vh; padding: 12px 14px 40px; }
  h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: .04em; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); margin: 18px 0 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  p.sub { color: var(--dim); margin: 0 0 10px; }
  .row { display: grid; grid-template-columns: 112px 1fr 42px; gap: 8px; align-items: center; margin: 5px 0; }
  .row output { text-align: right; color: var(--dim); }
  .row select, .row .wide { grid-column: 2 / 4; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  input[type=color] { width: 30px; height: 22px; padding: 0; border: 1px solid var(--line); background: none; }
  select, button, .btn { font: inherit; color: var(--text); background: #1b2030; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button:hover, .btn:hover { border-color: #3a4258; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }
  button.rec { background: #c81e3a; border-color: #c81e3a; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatches { display: flex; gap: 6px; align-items: center; }
  #drop { border: 1px dashed #3a4258; border-radius: 8px; padding: 12px; text-align: center; color: var(--dim); margin-bottom: 8px; }
  #drop.over { border-color: var(--accent); color: var(--text); }
  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; }
    #stage { height: 70vh; } #out { max-height: calc(70vh - 84px); }
    #panel { height: auto; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="hint">Click the item to track</div>
  <canvas id="out" width="720" height="1280"></canvas>
  <div id="bar">
    <button id="play">Pause</button>
    <input id="scrub" type="range" min="0" max="1" step="0.001" value="0">
    <span id="time">demo</span>
  </div>
</div>
<aside id="panel">
  <h1>DITHER TRACK</h1>
  <p class="sub">Dithered noise, tracking overlays, one tracked item, fixed palette.</p>
  <div id="drop">Drop a video or image here<br>or <label class="btn" style="display:inline-block;margin-top:6px">Choose file<input id="file" type="file" accept="video/*,image/*" hidden></label></div>
  <div class="btns">
    <button id="rec" class="primary">Record video</button>
    <button id="png">Save PNG</button>
    <button id="reset">Reset style</button>
  </div>
  <div id="controls"></div>
</aside>
<script>
'use strict';
// ---------- settings ----------
// Defaults reproduce the reference clip (720 x 1280, 24 fps).
const DEF = {
  aspect: 'source', size: 1280, fps: 24,
  blur: 0.45, exposure: 0.04, contrast: 1.15,
  c0: '#000008', c1: '#0d0c32', c2: '#3a5681', c3: '#9fb6e0', c4: '#ffffff',
  accentMode: 'warm', accentGain: 1.6, bandCentre: 0.6, bandWidth: 0.2,
  a0: '#5a1470', a1: '#ff5a14', a2: '#ffb0dc',
  keep: 0,
  dot: 2, algo: 'fs', noise: 0.5, noiseHold: 1, soften: true,
  blobs: true, blobMode: 'both', blobLow: 0.22, blobHigh: 0.8, blobMax: 6, blobMin: 0.01,
  extend: 0.6, dotted: true, labels: true, plus: true, lineAlpha: 0.75,
  track: true, trail: 14, trackLabel: false, lineColor: '#ffffff', trackColor: '#f4f0dc',
};
const S = Object.assign({}, DEF);
try { Object.assign(S, JSON.parse(localStorage.getItem('dither-track') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('dither-track', JSON.stringify(S)); } catch (e) {} };

const UI = [
  ['Output'],
  ['aspect', 'Frame', { source: 'As the source', '9:16': '9:16 portrait', '4:5': '4:5', '1:1': '1:1 square', '16:9': '16:9 landscape' }],
  ['size', 'Long side', { 1280: '1280 px (reference)', 1920: '1920 px', 1080: '1080 px', 720: '720 px' }],
  ['fps', 'Frames / sec', 6, 30, 1],
  ['Grade'],
  ['blur', 'Softness', 0, 1, 0.01],
  ['exposure', 'Exposure', -0.5, 0.5, 0.01],
  ['contrast', 'Contrast', 0.5, 2.5, 0.01],
  ['Palette'],
  ['ramp', 'Dark to light', ['c0', 'c1', 'c2', 'c3', 'c4']],
  ['accents', 'Accent', ['a0', 'a1', 'a2']],
  ['accentMode', 'Accent from', { warm: 'Warm colours in the source', band: 'A brightness band', track: 'Glow around the tracked item', off: 'No accent' }],
  ['accentGain', 'Accent amount', 0, 4, 0.05],
  ['bandCentre', 'Band centre', 0, 1, 0.01],
  ['bandWidth', 'Band / glow size', 0.03, 0.6, 0.01],
  ['keep', 'Source colour', 0, 1, 0.01],
  ['Noise and dither'],
  ['dot', 'Dot size', 1, 8, 1],
  ['algo', 'Pattern', { fs: 'Error diffusion (reference)', atkinson: 'Atkinson', bayer: 'Ordered grid', rand: 'Pure noise' }],
  ['noise', 'Noise', 0, 1.5, 0.01],
  ['noiseHold', 'Noise holds (frames)', 1, 6, 1],
  ['soften', 'Soften dots', 'bool'],
  ['Overlays'],
  ['blobs', 'Boxes', 'bool'],
  ['blobMode', 'Boxes around', { both: 'Dark and bright areas', dark: 'Dark areas', bright: 'Bright areas', motion: 'Movement' }],
  ['blobLow', 'Dark below', 0, 1, 0.01],
  ['blobHigh', 'Bright above', 0, 1, 0.01],
  ['blobMax', 'How many', 0, 16, 1],
  ['blobMin', 'Smallest area', 0.002, 0.1, 0.002],
  ['extend', 'Lines run on', 0, 1, 0.01],
  ['dotted', 'Dotted verticals', 'bool'],
  ['labels', 'Number tags', 'bool'],
  ['plus', 'Plus marks', 'bool'],
  ['lineAlpha', 'Line strength', 0, 1, 0.01],
  ['lineColor', 'Line colour', 'color'],
  ['Tracked item'],
  ['track', 'Show', 'bool'],
  ['trail', 'Trail length', 0, 80, 1],
  ['trackLabel', 'Number tag', 'bool'],
  ['trackColor', 'Colour', 'color'],
  ['clearTrack', 'Tracking point', 'button', 'Clear'],
];

const $ = (id) => document.getElementById(id);
const out = $('out'), octx = out.getContext('2d');
const work = document.createElement('canvas'), wctx = work.getContext('2d', { willReadFrequently: true });
const small = document.createElement('canvas'), sctx = small.getContext('2d');
const tcan = document.createElement('canvas'), tctx = tcan.getContext('2d', { willReadFrequently: true });

function buildUI() {
  const root = $('controls'); root.innerHTML = '';
  for (const [key, label, a, b, c] of UI) {
    if (label === undefined) { const h = document.createElement('h2'); h.textContent = key; root.append(h); continue; }
    const row = document.createElement('div'); row.className = 'row';
    const l = document.createElement('label'); l.textContent = label; row.append(l);
    if (Array.isArray(a)) {
      const w = document.createElement('div'); w.className = 'swatches wide';
      for (const k of a) { const i = document.createElement('input'); i.type = 'color'; i.value = S[k]; i.oninput = () => { S[k] = i.value; changed(); }; w.append(i); }
      row.append(w);
    } else if (a === 'button') {
      const bt = document.createElement('button'); bt.textContent = b; bt.className = 'wide'; bt.onclick = () => { T.active = false; T.trail = []; }; row.append(bt);
    } else if (a === 'bool' || a === 'color') {
      const i = document.createElement('input'); i.type = a === 'bool' ? 'checkbox' : 'color';
      if (a === 'bool') i.checked = S[key]; else i.value = S[key];
      i.oninput = () => { S[key] = a === 'bool' ? i.checked : i.value; changed(); };
      const w = document.createElement('div'); w.className = 'wide'; w.append(i); row.append(w);
    } else if (typeof a === 'object') {
      const s = document.createElement('select');
      for (const v in a) { const o = document.createElement('option'); o.value = v; o.textContent = a[v]; s.append(o); }
      s.value = String(S[key]);
      s.onchange = () => { S[key] = isNaN(+s.value) ? s.value : +s.value; changed(); };
      row.append(s);
    } else {
      const i = document.createElement('input'); i.type = 'range'; i.min = a; i.max = b; i.step = c; i.value = S[key];
      const o = document.createElement('output'); o.textContent = S[key];
      i.oninput = () => { S[key] = +i.value; o.textContent = i.value; changed(); };
      row.append(i, o);
    }
    root.append(row);
  }
}

// ---------- palette lookup tables ----------
const rampLUT = new Uint8Array(768), accLUT = new Uint8Array(768);
const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function fillLUT(lut, stops) {
  for (let i = 0; i < 256; i++) {
    const t = i / 255; let k = 0;
    while (k < stops.length - 2 && t > stops[k + 1][0]) k++;
    const [t0, c0] = stops[k], [t1, c1] = stops[k + 1];
    const f = Math.min(1, Math.max(0, (t - t0) / (t1 - t0)));
    for (let c = 0; c < 3; c++) lut[i * 3 + c] = c0[c] + (c1[c] - c0[c]) * f;
  }
}
function changed() {
  fillLUT(rampLUT, [[0, hex(S.c0)], [0.2, hex(S.c1)], [0.48, hex(S.c2)], [0.75, hex(S.c3)], [1, hex(S.c4)]]);
  fillLUT(accLUT, [[0, hex(S.a0)], [0.45, hex(S.a1)], [0.8, hex(S.a2)], [1, [255, 255, 255]]]);
  layout(); save();
}

// ---------- source ----------
let src = null; // { el, w, h, video }
const video = document.createElement('video'); video.muted = true; video.loop = true; video.playsInline = true;
const demo = document.createElement('canvas'); demo.width = 360; demo.height = 640; const dctx = demo.getContext('2d');
let demoT = 0, paused = false;
function drawDemo(t) {
  // A stand-in scene until a file is loaded: a dark shape walking through blue light with a warm glow.
  const g = dctx.createLinearGradient(0, 0, 360, 640); g.addColorStop(0, '#3b5a8c'); g.addColorStop(1, '#22406e');
  dctx.fillStyle = g; dctx.fillRect(0, 0, 360, 640);
  const blob = (x, y, r, col) => { const q = dctx.createRadialGradient(x, y, 0, x, y, r); q.addColorStop(0, col); q.addColorStop(1, 'rgba(0,0,0,0)'); dctx.fillStyle = q; dctx.fillRect(x - r, y - r, r * 2, r * 2); };
  const x = 180 + Math.sin(t * 0.8) * 70, y = 240 + Math.sin(t * 1.7) * 14;
  blob(300, 420, 240, 'rgba(255,255,255,.95)'); blob(310, 110, 200, 'rgba(220,235,255,.8)');
  blob(x + 70, y + 40, 110, 'rgba(255,90,10,.95)');
  blob(x, y, 95, 'rgba(0,0,8,1)'); blob(x - 50, y + 10, 60, 'rgba(0,0,8,1)'); blob(x + 40, y - 10, 70, 'rgba(0,0,10,.95)');
  const leg = Math.sin(t * 5) * 25;
  blob(x - 30 + leg, y + 130, 45, 'rgba(10,10,60,.9)'); blob(x + 30 - leg, y + 130, 45, 'rgba(10,10,60,.9)');
  dctx.fillStyle = 'rgba(10,20,60,.35)'; dctx.fillRect(0, 470, 360, 170);
}
function useDemo() { src = { el: demo, w: 360, h: 640, video: false, demo: true }; T.active = false; layout(); $('time').textContent = 'demo'; }
function load(file) {
  if (!file) return;
  const url = URL.createObjectURL(file);
  T.active = false; T.trail = []; blobs = []; prevMask = null;
  if (file.type.startsWith('image/')) {
    const im = new Image(); im.onload = () => { src = { el: im, w: im.naturalWidth, h: im.naturalHeight, video: false }; layout(); $('time').textContent = 'image'; }; im.src = url;
  } else {
    video.src = url;
    video.onloadedmetadata = () => { src = { el: video, w: video.videoWidth, h: video.videoHeight, video: true }; layout(); paused = false; video.play(); $('play').textContent = 'Pause'; };
    video.onerror = () => { alert('This browser cannot play that video file. Try an MP4 (H.264).'); };
  }
}

// ---------- layout ----------
let crop = { x: 0, y: 0, w: 1, h: 1 }, noiseBuf = null;
function layout() {
  if (!src) return;
  let ar = src.w / src.h;
  if (S.aspect !== 'source') { const [a, b] = S.aspect.split(':').map(Number); ar = a / b; }
  const sa = src.w / src.h;
  crop = sa > ar ? { w: src.h * ar, h: src.h, x: (src.w - src.h * ar) / 2, y: 0 } : { w: src.w, h: src.w / ar, x: 0, y: (src.h - src.w / ar) / 2 };
  const W = ar >= 1 ? S.size : Math.round(S.size * ar / 2) * 2, H = ar >= 1 ? Math.round(S.size / ar / 2) * 2 : S.size;
  if (out.width !== W || out.height !== H) { out.width = W; out.height = H; }
  // Dot size is given at the reference width of 720, so the look holds at any output size.
  const k = Math.min(W, H) / 720, dw = Math.max(8, Math.round(W / (S.dot * k))), dh = Math.max(8, Math.round(H / (S.dot * k)));
  if (work.width !== dw || work.height !== dh) { work.width = dw; work.height = dh; noiseBuf = null; }
  tcan.width = 160; tcan.height = Math.max(8, Math.round(160 * H / W));
}

// ---------- tracker (one item, template matching) ----------
const T = { active: false, x: 0.5, y: 0.5, tpl: null, orig: null, anchor: null, trail: [], id: 1, init: false };
const R = 8; // template half size, on the 160 px wide tracking frame
function gray() {
  const w = tcan.width, h = tcan.height;
  tctx.drawImage(src.el, crop.x, crop.y, crop.w, crop.h, 0, 0, w, h);
  const d = tctx.getImageData(0, 0, w, h).data, g = new Float32Array(w * h);
  for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = d[j] * 0.3 + d[j + 1] * 0.59 + d[j + 2] * 0.11;
  return g;
}
function grab(g, w, h, cx, cy) {
  const n = 2 * R + 1, t = new Float32Array(n * n); let m = 0;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const sx = Math.min(w - 1, Math.max(0, cx + x - R)), sy = Math.min(h - 1, Math.max(0, cy + y - R));
    m += t[y * n + x] = g[sy * w + sx];
  }
  m /= n * n; for (let i = 0; i < t.length; i++) t[i] -= m;
  return t;
}
function score(g, w, h, cx, cy, tpl) {
  const n = 2 * R + 1; let m = 0;
  for (let y = 0; y < n; y++) { const row = (cy + y - R) * w + cx - R; for (let x = 0; x < n; x++) m += g[row + x]; }
  m /= n * n; let s = 0;
  for (let y = 0; y < n; y++) { const row = (cy + y - R) * w + cx - R; for (let x = 0; x < n; x++) s += Math.abs(g[row + x] - m - tpl[y * n + x]); }
  return s / (n * n);
}
function search(g, w, h, cx, cy, rad, step, tpl) {
  let best = 1e9, bx = cx, by = cy;
  const x0 = Math.max(R, cx - rad), x1 = Math.min(w - R - 1, cx + rad), y0 = Math.max(R, cy - rad), y1 = Math.min(h - R - 1, cy + rad);
  for (let y = y0; y <= y1; y += step) for (let x = x0; x <= x1; x += step) {
    const s = score(g, w, h, x, y, tpl) + 0.02 * Math.hypot(x - cx, y - cy); // slight pull to the last position
    if (s < best) { best = s; bx = x; by = y; }
  }
  return [bx, by, best];
}
function trackStep(advance) {
  if (!T.active) return;
  const w = tcan.width, h = tcan.height, g = gray();
  let cx = Math.round(T.x * w), cy = Math.round(T.y * h);
  if (T.init) { T.tpl = grab(g, w, h, cx, cy); T.orig = T.tpl.slice(); T.init = false; T.trail = []; }
  else if (advance) {
    let [bx, by, s] = search(g, w, h, cx, cy, 14, 1, T.tpl);
    if (s > 26) { // lost: look over the whole frame for the item as first clicked
      const [gx, gy] = search(g, w, h, w >> 1, h >> 1, Math.max(w, h), 2, T.orig);
      const [fx, fy, fs] = search(g, w, h, gx, gy, 2, 1, T.orig);
      if (fs < s) { bx = fx; by = fy; s = fs; }
    }
    if (s < 18) { const cur = grab(g, w, h, bx, by); for (let i = 0; i < cur.length; i++) T.tpl[i] = T.tpl[i] * 0.92 + cur[i] * 0.08; }
    T.x += (bx / w - T.x) * 0.7; T.y += (by / h - T.y) * 0.7;
    T.trail.push([T.x, T.y]);
  }
  while (T.trail.length > S.trail + 1) T.trail.shift();
}

// ---------- boxes (connected areas, with ids that persist) ----------
let blobs = [], nextId = 20, prevMask = null;
function findBlobs(L, w, h) {
  const bw = 48, bh = Math.max(4, Math.round(48 * h / w)), n = bw * bh, lum = new Float32Array(n), cls = new Uint8Array(n);
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) lum[y * bw + x] = L[Math.floor((y + 0.5) * h / bh) * w + Math.floor((x + 0.5) * w / bw)] / 255;
  for (let i = 0; i < n; i++) {
    if (S.blobMode === 'motion') cls[i] = prevMask && Math.abs(lum[i] - prevMask[i]) > 0.04 + S.blobLow * 0.2 ? 1 : 0;
    else cls[i] = (S.blobMode !== 'bright' && lum[i] < S.blobLow) ? 1 : (S.blobMode !== 'dark' && lum[i] > S.blobHigh) ? 2 : 0;
  }
  prevMask = lum;
  const seen = new Uint8Array(n), found = [], stack = [];
  for (let i = 0; i < n; i++) {
    if (!cls[i] || seen[i]) continue;
    let x0 = bw, x1 = 0, y0 = bh, y1 = 0, area = 0; stack.push(i); seen[i] = 1;
    while (stack.length) {
      const p = stack.pop(), px = p % bw, py = (p / bw) | 0; area++;
      if (px < x0) x0 = px; if (px > x1) x1 = px; if (py < y0) y0 = py; if (py > y1) y1 = py;
      for (const q of [p - 1, p + 1, p - bw, p + bw]) {
        if (q < 0 || q >= n || seen[q] || cls[q] !== cls[i]) continue;
        if ((q === p - 1 && px === 0) || (q === p + 1 && px === bw - 1)) continue;
        seen[q] = 1; stack.push(q);
      }
    }
    if (area / n >= S.blobMin) found.push({ x0: x0 / bw, y0: y0 / bh, x1: (x1 + 1) / bw, y1: (y1 + 1) / bh, area });
  }
  found.sort((a, b) => b.area - a.area); found.length = Math.min(found.length, S.blobMax);
  const old = blobs; blobs = [];
  for (const f of found) {
    const cx = (f.x0 + f.x1) / 2, cy = (f.y0 + f.y1) / 2; let m = null, md = 0.18;
    for (const o of old) { if (o.used) continue; const d = Math.hypot((o.x0 + o.x1) / 2 - cx, (o.y0 + o.y1) / 2 - cy); if (d < md) { md = d; m = o; } }
    if (m) { m.used = true; for (const k of ['x0', 'y0', 'x1', 'y1']) f[k] = m[k] + (f[k] - m[k]) * 0.5; f.id = m.id; }
    else { nextId += 1 + ((Math.random() * 9) | 0); f.id = nextId; }
    blobs.push(f);
  }
}

// ---------- render ----------
const NZ = Float32Array.from({ length: 256 }, (_, i) => 0.2 + 0.8 * Math.sin(Math.PI * i / 255));
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
let frameNo = 0, noiseOff = 0, fbuf = null;
function render(advance) {
  if (!src) return;
  const w = work.width, h = work.height, n = w * h, W = out.width, H = out.height;
  if (src.demo) drawDemo(demoT);
  // 1. soften: draw small, then back up
  const bf = 1 + S.blur * 11; small.width = Math.max(2, Math.round(w / bf)); small.height = Math.max(2, Math.round(h / bf));
  sctx.imageSmoothingQuality = 'high'; sctx.drawImage(src.el, crop.x, crop.y, crop.w, crop.h, 0, 0, small.width, small.height);
  wctx.imageSmoothingEnabled = true; wctx.imageSmoothingQuality = 'high'; wctx.drawImage(small, 0, 0, w, h);
  const img = wctx.getImageData(0, 0, w, h), d = img.data;
  trackStep(advance);
  // 2. grade into the palette, add noise
  if (!noiseBuf || noiseBuf.length !== n + 4096) { noiseBuf = new Float32Array(n + 4096); for (let i = 0; i < noiseBuf.length; i++) noiseBuf[i] = Math.random() - 0.5; }
  if (advance && frameNo % S.noiseHold === 0) { noiseOff = (Math.random() * 4096) | 0; if (frameNo % 8 === 0) for (let i = 0; i < 2048; i++) noiseBuf[(Math.random() * noiseBuf.length) | 0] = Math.random() - 0.5; }
  if (!fbuf || fbuf.length !== n * 3) fbuf = new Float32Array(n * 3);
  const L = new Uint8Array(n), f = fbuf, na = S.noise * 255, keep = S.keep, gain = S.accentMode === 'off' ? 0 : S.accentGain;
  const tx = T.x * w, ty = T.y * h, sig = Math.max(2, S.bandWidth * Math.max(w, h) * 0.6), glow = S.accentMode === 'track' && T.active;
  for (let i = 0, j = 0, p = 0; i < n; i++, j += 4, p += 3) {
    const r = d[j], g = d[j + 1], b = d[j + 2];
    let l = ((r * 0.3 + g * 0.59 + b * 0.11) - 128) * S.contrast + 128 + S.exposure * 255;
    l = l < 0 ? 0 : l > 255 ? 255 : l | 0; L[i] = l;
    let a = 0;
    if (gain) {
      if (S.accentMode === 'warm') a = (r - b) / 255 * gain;
      else if (S.accentMode === 'band') { const q = (l / 255 - S.bandCentre) / S.bandWidth; a = (1 - q * q) * gain; }
      else if (glow) { const x = i % w - tx, y = ((i / w) | 0) - ty; a = Math.exp(-(x * x + y * y) / (sig * sig)) * gain; }
      a = a < 0 ? 0 : a > 1 ? 1 : a;
    }
    const nz = noiseBuf[i + noiseOff] * na * NZ[l], l3 = l * 3; // less noise in pure black and white, as in the reference
    for (let c = 0; c < 3; c++) {
      let v = rampLUT[l3 + c]; v += (accLUT[l3 + c] - v) * a;
      if (keep) { const s = d[j + c], sat = l + (s - (r * 0.3 + g * 0.59 + b * 0.11)) * 1.8; v += (sat - v) * keep; }
      f[p + c] = v + nz;
    }
  }
  if (S.blobs && advance) findBlobs(L, w, h);
  // 3. dither each channel to on / off
  if (S.algo === 'fs' || S.algo === 'atkinson') {
    const atk = S.algo === 'atkinson', w3 = w * 3;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const p = (y * w + x) * 3;
      for (let c = 0; c < 3; c++) {
        const q = p + c, v = f[q], o = v > 127.5 ? 255 : 0, e = v - o; d[(q - c) / 3 * 4 + c] = o;
        if (atk) { const k = e / 8; if (x + 1 < w) f[q + 3] += k; if (x + 2 < w) f[q + 6] += k; if (y + 1 < h) { if (x > 0) f[q + w3 - 3] += k; f[q + w3] += k; if (x + 1 < w) f[q + w3 + 3] += k; } if (y + 2 < h) f[q + 2 * w3] += k; }
        else { if (x + 1 < w) f[q + 3] += e * 0.4375; if (y + 1 < h) { if (x > 0) f[q + w3 - 3] += e * 0.1875; f[q + w3] += e * 0.3125; if (x + 1 < w) f[q + w3 + 3] += e * 0.0625; } }
      }
    }
  } else {
    for (let i = 0, p = 0; i < n; i++, p += 3) {
      const th = S.algo === 'bayer' ? (BAYER[((((i / w) | 0) & 3) << 2) | (i % w & 3)] + 0.5) * 16 : (noiseBuf[(i + noiseOff * 7) % noiseBuf.length] + 0.5) * 255;
      d[i * 4] = f[p] > th ? 255 : 0; d[i * 4 + 1] = f[p + 1] > th ? 255 : 0; d[i * 4 + 2] = f[p + 2] > th ? 255 : 0;
    }
  }
  for (let j = 3; j < d.length; j += 4) d[j] = 255;
  wctx.putImageData(img, 0, 0);
  octx.imageSmoothingEnabled = S.soften && W / w < 4; octx.imageSmoothingQuality = 'low';
  octx.drawImage(work, 0, 0, W, H);
  overlays(W, H);
}

function tag(x, y, text, k) {
  octx.font = `700 ${Math.round(9 * k)}px ui-monospace, Menlo, Consolas, monospace`;
  const tw = octx.measureText(text).width, bw = tw + 6 * k, bh = 13 * k;
  x = Math.max(0, Math.min(out.width - bw, x)); y = Math.max(0, Math.min(out.height - bh, y));
  octx.globalAlpha = 0.95; octx.fillStyle = S.lineColor; octx.fillRect(Math.round(x), Math.round(y), bw, bh);
  octx.fillStyle = '#15182a'; octx.textBaseline = 'middle'; octx.fillText(text, Math.round(x) + 3 * k, Math.round(y) + bh / 2 + 0.5 * k);
}
function overlays(W, H) {
  const k = Math.min(W, H) / 720;
  octx.save(); octx.lineWidth = Math.max(1, k); octx.strokeStyle = S.lineColor; octx.fillStyle = S.lineColor;
  const line = (x0, y0, x1, y1, a, dash) => { octx.globalAlpha = a; octx.setLineDash(dash ? [2 * k, 2 * k] : []); octx.beginPath(); octx.moveTo(Math.round(x0) + 0.5, Math.round(y0) + 0.5); octx.lineTo(Math.round(x1) + 0.5, Math.round(y1) + 0.5); octx.stroke(); };
  if (S.blobs) for (const b of blobs) {
    const x0 = b.x0 * W, x1 = b.x1 * W, y0 = b.y0 * H, y1 = b.y1 * H, A = S.lineAlpha, e = S.extend, far = A * 0.45;
    // the lines run past the box toward the frame edges, fainter, as in the reference
    if (e) { line(x0 - x0 * e, y0, x1 + (W - x1) * e, y0, far); line(x0 - x0 * e, y1, x1 + (W - x1) * e, y1, far); line(x0, y0 - y0 * e, x0, y1 + (H - y1) * e, far, S.dotted); line(x1, y0 - y0 * e, x1, y1 + (H - y1) * e, far, S.dotted); }
    line(x0, y0, x1, y0, A); line(x0, y1, x1, y1, A); line(x0, y0, x0, y1, A, S.dotted); line(x1, y0, x1, y1, A, S.dotted);
    if (S.plus) { octx.setLineDash([]); octx.globalAlpha = A; const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, r = 4 * k; line(cx - r, cy, cx + r, cy, A); line(cx, cy - r, cx, cy + r, A); }
    if (S.labels) tag(x0 - 2 * k, y0 - 6 * k, '#' + b.id, k);
  }
  if (S.track && T.active) {
    octx.setLineDash([]); octx.strokeStyle = S.trackColor; octx.globalAlpha = 0.95; octx.lineWidth = Math.max(1, 1.4 * k); octx.lineJoin = 'round';
    if (T.trail.length > 1) { octx.beginPath(); T.trail.forEach(([x, y], i) => i ? octx.lineTo(x * W, y * H) : octx.moveTo(x * W, y * H)); octx.stroke(); }
    const x = T.x * W, y = T.y * H; octx.lineWidth = Math.max(1, 1.8 * k);
    octx.beginPath(); octx.arc(x, y, 5 * k, 0, 7); octx.stroke();
    octx.beginPath(); octx.moveTo(x - 9 * k, y); octx.lineTo(x - 2 * k, y); octx.moveTo(x + 2 * k, y); octx.lineTo(x + 9 * k, y); octx.stroke();
    if (S.trackLabel) tag(x + 10 * k, y - 18 * k, '#' + T.id, k);
  }
  octx.restore();
}

// ---------- loop ----------
let last = 0, lastVT = -1;
function tick(now) {
  requestAnimationFrame(tick);
  if (!src || now - last < 1000 / S.fps - 2) return;
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  let advance = !paused;
  if (src.video) {
    const t = video.currentTime;
    if (t < lastVT - 0.2 && T.active && T.anchor) { T.x = T.anchor.x; T.y = T.anchor.y; T.tpl = T.orig.slice(); T.trail = []; } // looped
    advance = t !== lastVT; lastVT = t;
    if (!scrubbing) $('scrub').value = video.duration ? t / video.duration : 0;
    $('time').textContent = t.toFixed(1) + ' / ' + (video.duration || 0).toFixed(1) + ' s';
  } else if (src.demo && !paused) demoT += dt;
  if (advance) frameNo++;
  render(advance);
}

// ---------- interaction ----------
out.addEventListener('pointerdown', (e) => {
  const r = out.getBoundingClientRect();
  T.x = (e.clientX - r.left) / r.width; T.y = (e.clientY - r.top) / r.height;
  T.active = true; T.init = true; T.id = (nextId += 3); T.anchor = { x: T.x, y: T.y };
  $('hint').style.display = 'none';
});
let scrubbing = false;
$('scrub').oninput = () => { scrubbing = true; if (src && src.video && video.duration) video.currentTime = $('scrub').value * video.duration; };
$('scrub').onchange = () => { scrubbing = false; };
$('play').onclick = () => { paused = !paused; if (src && src.video) paused ? video.pause() : video.play(); $('play').textContent = paused ? 'Play' : 'Pause'; };
$('file').onchange = (e) => load(e.target.files[0]);
const drop = $('drop');
addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
addEventListener('dragleave', () => drop.classList.remove('over'));
addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); load(e.dataTransfer.files[0]); });
$('reset').onclick = () => { Object.assign(S, DEF); buildUI(); changed(); };
const download = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); };
$('png').onclick = () => out.toBlob((b) => download(b, 'dither-track.png'), 'image/png');

// Recording plays the source once from the start, in real time, and saves what the canvas shows.
let recorder = null;
$('rec').onclick = async () => {
  if (recorder) { recorder.stop(); return; }
  if (!window.MediaRecorder) { alert('This browser cannot record video. Use Chrome, Edge, Firefox or Safari 14.1 and newer.'); return; }
  const mime = ['video/mp4;codecs=avc1.640028', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m));
  const chunks = []; recorder = new MediaRecorder(out.captureStream(S.fps), { mimeType: mime, videoBitsPerSecond: 16e6 });
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    download(new Blob(chunks, { type: mime }), 'dither-track.' + (mime.includes('mp4') ? 'mp4' : 'webm'));
    recorder = null; $('rec').textContent = 'Record video'; $('rec').classList.remove('rec'); video.loop = true; if (src.video) video.play();
  };
  $('rec').textContent = 'Stop recording'; $('rec').classList.add('rec'); paused = false; $('play').textContent = 'Pause';
  if (src.video) {
    video.loop = false; video.pause(); video.currentTime = 0;
    await new Promise((r) => video.addEventListener('seeked', r, { once: true }));
    video.addEventListener('ended', () => recorder && recorder.stop(), { once: true });
    recorder.start(); video.play();
  } else { recorder.start(); setTimeout(() => recorder && recorder.stop(), 8000); } // image or demo: 8 seconds
};

buildUI(); changed(); useDemo(); requestAnimationFrame(tick);
</script>
</body>
