name: Render visuals

# Social visuals (visuals/<name>/index.html) to PNG, and the ones marked
# <body data-video> to MP4 (visuals/animate.mjs, ffmpeg). The files are
# committed to the branch claude/visuals as visuals/<name>.png / .mp4.

on:
  push:
    branches: [claude/forwardone-web-gl4kz9]
    paths: ['visuals/**', '.github/workflows/render-visuals.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visuals
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Render
        run: |
          python3 -m http.server 4600 >/dev/null 2>&1 &
          until curl -s localhost:4600 >/dev/null; do sleep 1; done
          node visuals/render.mjs
          node visuals/animate.mjs
      - name: Commit to claude/visuals
        run: |
          mkdir -p /tmp/png && cp visuals/out/*.png visuals/out/*.mp4 /tmp/png/
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          if git fetch origin claude/visuals; then
            git checkout -f -B claude/visuals origin/claude/visuals
          else
            git checkout -f --orphan claude/visuals && git rm -rqf .
          fi
          mkdir -p visuals && cp /tmp/png/* visuals/
          git add visuals/
          git diff --cached --quiet || git commit -m "Visuals from ${GITHUB_SHA::7}"
          git push origin claude/visuals
