name: Booking data

# Lists the live booking database without personal details (the logs of this
# public repository are public): per request a short id, the slot, status,
# date and only the domain of the email address. With "delete", removes the
# requests whose short ids are given (owner's say-so, e.g. test bookings
# before launch) and the per-sender counts.

on:
  workflow_dispatch:
    inputs:
      action:
        description: list or delete
        default: list
        required: true
      ids:
        description: "delete: short ids (first 8 characters), space separated"
        default: ''
        required: false

permissions:
  contents: read

concurrency:
  group: booking
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: booking/package-lock.json
      - run: npm ci
      - name: Database id
        run: |
          id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{process.stdout.write(JSON.parse(s).find(d=>d.name==="forwardone-pitch").uuid)})')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Delete
        if: inputs.action == 'delete'
        env:
          IDS: ${{ inputs.ids }}
        run: |
          for id in $IDS; do
            case "$id" in *[!a-f0-9-]*|'') echo "skipped bad id"; continue;; esac
            npx wrangler d1 execute forwardone-pitch --remote --command "DELETE FROM applications WHERE substr(id,1,8) = '$id'" | grep -E '"changes"' || true
          done
          npx wrangler d1 execute forwardone-pitch --remote --command "DELETE FROM attempts" >/dev/null
      - name: List
        run: |
          npx wrangler d1 execute forwardone-pitch --remote --json --command "SELECT substr(a.id,1,8) AS id, s.label AS slot, a.status, substr(a.created_at,1,16) AS created, substr(a.email, instr(a.email,'@')+1) AS domain FROM applications a JOIN slots s ON s.id = a.slot_id ORDER BY a.created_at" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s)[0].results;console.log(r.length+" requests");for(const x of r)console.log([x.id,x.slot,x.status,x.created,x.domain].join("  "))})'
