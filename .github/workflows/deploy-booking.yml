name: Deploy the pitch booking service

# The booking service for /the-pitch (booking/, a Cloudflare Worker with a
# D1 database). Runs when booking/ changes on the default branch, or by
# hand. Does nothing until the CLOUDFLARE_API_TOKEN secret exists (A0018).

on:
  push:
    branches: [claude/forwardone-web-gl4kz9]
    # src/content/pitch.ts: the page's original texts, shown on the dashboard.
    paths: ['booking/**', 'src/content/pitch.ts', '.github/workflows/deploy-booking.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: booking
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip until Cloudflare is connected
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set: nothing deployed (see booking/README.md)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: booking/package-lock.json
      - if: steps.gate.outputs.go == 'true'
        run: npm ci
      - if: steps.gate.outputs.go == 'true'
        name: Database (created on the first run)
        run: |
          id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name==="forwardone-pitch");process.stdout.write(db?db.uuid:"")})')
          if [ -z "$id" ]; then
            npx wrangler d1 create forwardone-pitch
            id=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{process.stdout.write(JSON.parse(s).find(d=>d.name==="forwardone-pitch").uuid)})')
          fi
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          npx wrangler d1 migrations apply forwardone-pitch --remote
      - if: steps.gate.outputs.go == 'true'
        name: Slots (from slots.json)
        run: |
          node scripts/slots-sql.mjs > slots.sql
          npx wrangler d1 execute forwardone-pitch --remote --file slots.sql
      - if: steps.gate.outputs.go == 'true'
        name: Page texts' originals (from src/content/pitch.ts)
        run: npm run defaults
      - if: steps.gate.outputs.go == 'true'
        name: Deploy
        env:
          # Public (it is in every page that shows the check), so a variable.
          TURNSTILE_SITE_KEY: ${{ vars.PITCH_TURNSTILE_SITE_KEY }}
        run: |
          if [ -n "$TURNSTILE_SITE_KEY" ]; then
            npx wrangler deploy --var "TURNSTILE_SITE_KEY:$TURNSTILE_SITE_KEY"
          else
            npx wrangler deploy
          fi
      - if: steps.gate.outputs.go == 'true'
        name: Secrets
        env:
          REVIEWERS: ${{ secrets.PITCH_REVIEWERS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SESSION_SECRET: ${{ secrets.PITCH_SESSION_SECRET }}
          TURNSTILE_SECRET: ${{ secrets.PITCH_TURNSTILE_SECRET }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.PITCH_RESEND_WEBHOOK_SECRET }}
        run: |
          have=$(npx wrangler secret list --format json || echo '[]')
          put() { printf '%s' "$2" | npx wrangler secret put "$1"; }
          [ -n "$REVIEWERS" ] && put REVIEWERS "$REVIEWERS"
          [ -n "$RESEND_API_KEY" ] && put RESEND_API_KEY "$RESEND_API_KEY"
          [ -n "$TURNSTILE_SECRET" ] && put TURNSTILE_SECRET "$TURNSTILE_SECRET"
          [ -n "$RESEND_WEBHOOK_SECRET" ] && put RESEND_WEBHOOK_SECRET "$RESEND_WEBHOOK_SECRET"
          if [ -n "$SESSION_SECRET" ]; then
            put SESSION_SECRET "$SESSION_SECRET"
          elif ! printf '%s' "$have" | grep -q '"SESSION_SECRET"'; then
            # First run without one: make a random key and keep it on Cloudflare.
            put SESSION_SECRET "$(openssl rand -hex 32)"
          fi
          true
