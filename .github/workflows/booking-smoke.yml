name: Booking smoke test

# Checks the live booking service from outside (Claude's environment cannot
# reach workers.dev). Read-only: the one POST /apply is invalid on purpose,
# so nothing is stored or emailed.

on:
  push:
    branches: [claude/forwardone-web-gl4kz9]
    paths: ['.github/workflows/booking-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      API: https://forwardone-pitch-booking.jeroen-191.workers.dev
      ORIGIN: https://www.forward.one
    steps:
      - name: Check
        run: |
          show() { echo; echo "== $1"; }
          show "GET /slots"; curl -sS -H "Origin: $ORIGIN" -D - "$API/slots" -o slots.json | grep -iE "^HTTP|access-control-allow-origin"; python3 -c "import json; s=json.load(open('slots.json'))['slots']; print(len(s), 'slots,', sum(1 for x in s if x.get('free', x.get('available'))), 'free; first', s[0])"
          show "GET /copy"; curl -sS -H "Origin: $ORIGIN" -D - "$API/copy" | grep -iE "^HTTP|access-control-allow-origin|cache-control|^\{" | cut -c1-400
          show "OPTIONS /apply (CORS)"; curl -sS -X OPTIONS -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: POST" -D - "$API/apply" -o /dev/null | grep -iE "^HTTP|access-control"
          show "OPTIONS /apply from a foreign origin"; curl -sS -X OPTIONS -H "Origin: https://evil.example" -D - "$API/apply" -o /dev/null | grep -iE "^HTTP|access-control-allow-origin" || echo "(no allow-origin: good)"
          show "POST /apply, empty letter (must be refused, nothing stored)"; curl -sS -H "Origin: $ORIGIN" -H "Content-Type: application/json" -d '{"turnstile":"x"}' -w "\nHTTP %{http_code}\n" "$API/apply"
          show "GET /review (login page)"; curl -sS -o /dev/null -w "HTTP %{http_code}\n" "$API/review"
          show "GET /review/page without login"; curl -sS -o /dev/null -w "HTTP %{http_code}\n" "$API/review/page"
          show "POST /resend-events unsigned"; curl -sS -X POST -d '{}' -w "\nHTTP %{http_code}\n" "$API/resend-events"
          show "GET /cancel with a bad token"; curl -sS "$API/cancel?t=bad" | grep -o "no longer active" || true
          show "GET /"; curl -sS -o /dev/null -w "HTTP %{http_code} -> %{redirect_url}\n" "$API/"
